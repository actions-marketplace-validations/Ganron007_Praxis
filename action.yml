name: 'Praxis Security Scan'
# Marketplace caps `description` at 124 characters, so this stays a scannable summary.
# The longer pitch — SARIF to Code Scanning, the net-new PR gate, framework coverage —
# belongs in the Marketplace listing body, which has no such limit.
description: 'AI-native scanning for LLM apps, agents, MCP servers and RAG pipelines. Plus secrets, code flaws and CVEs. 28 agents.'
author: 'Praxis'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: 'Path to scan (default: repository root)'
    required: false
    default: '.'
  threshold:
    description: 'Minimum score to pass (0-100, default: 75)'
    required: false
    default: '75'
  fail-on:
    description: 'Fail on severity level: critical, high, medium, low (overrides threshold)'
    required: false
    default: ''
  sarif:
    description: 'Generate SARIF file and upload to GitHub Code Scanning'
    required: false
    default: 'true'
  deep:
    description: 'Enable AI deep analysis (requires ANTHROPIC_API_KEY, OPENAI_API_KEY, or GOOGLE_AI_API_KEY)'
    required: false
    default: 'false'
  deps:
    description: 'Audit dependency CVEs'
    required: false
    default: 'true'
  baseline:
    description: 'Only report new findings (compare against baseline)'
    required: false
    default: 'false'
  net-new:
    description: 'PR mode: scan the base ref in a worktree and fail only on findings INTRODUCED by this PR'
    required: false
    default: 'false'
  fail-on-new:
    description: 'With net-new: minimum severity of introduced findings that fails the PR (default: high)'
    required: false
    default: 'high'
  always-fail-on:
    description: 'Severity floor that even an accepted baseline cannot suppress'
    required: false
    default: ''
  comment:
    description: 'Post scan summary as PR comment'
    required: false
    default: 'true'
  token:
    description: 'GitHub token for PR comments and SARIF upload (default: github.token)'
    required: false
    default: ${{ github.token }}

outputs:
  score:
    description: 'Security score (0-100)'
    value: ${{ steps.scan.outputs.score }}
  grade:
    description: 'Letter grade (A-F)'
    value: ${{ steps.scan.outputs.grade }}
  findings:
    description: 'Total number of findings'
    value: ${{ steps.scan.outputs.findings }}
  secrets:
    description: 'Number of secrets detected'
    value: ${{ steps.scan.outputs.secrets }}
  vulns:
    description: 'Number of code vulnerabilities'
    value: ${{ steps.scan.outputs.vulns }}
  cves:
    description: 'Number of dependency CVEs'
    value: ${{ steps.scan.outputs.cves }}
  sarif-file:
    description: 'Path to SARIF file (if generated)'
    value: ${{ steps.scan.outputs.sarif-file }}
  report-url:
    description: 'Workflow run containing the scan summary'
    value: ${{ steps.scan.outputs.report-url }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'

    - name: Install Praxis
      shell: bash
      env:
        PRAXIS_ACTION_PATH: ${{ github.action_path }}
      # Run the code selected by the Action ref, with dependencies from its lockfile.
      run: npm ci --prefix "$PRAXIS_ACTION_PATH" --omit=dev --ignore-scripts --no-audit --no-fund

    - name: Run security scan
      id: scan
      shell: bash
      env:
        PRAXIS_ACTION_PATH: ${{ github.action_path }}
        PRAXIS_INPUT_PATH: ${{ inputs.path }}
        PRAXIS_INPUT_THRESHOLD: ${{ inputs.threshold }}
        PRAXIS_INPUT_FAIL_ON: ${{ inputs.fail-on }}
        PRAXIS_INPUT_ALWAYS_FAIL_ON: ${{ inputs.always-fail-on }}
        PRAXIS_INPUT_SARIF: ${{ inputs.sarif }}
        PRAXIS_INPUT_DEEP: ${{ inputs.deep }}
        PRAXIS_INPUT_DEPS: ${{ inputs.deps }}
        PRAXIS_INPUT_BASELINE: ${{ inputs.baseline }}
        PRAXIS_INPUT_NET_NEW: ${{ inputs.net-new }}
        PRAXIS_INPUT_FAIL_ON_NEW: ${{ inputs.fail-on-new }}
        PRAXIS_INPUT_COMMENT: ${{ inputs.comment }}
        PRAXIS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PRAXIS_PR_NUMBER: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ inputs.token }}
      run: node "$PRAXIS_ACTION_PATH/cli/integrations/github-action.js"

    - name: Upload SARIF to GitHub Code Scanning
      if: inputs.sarif == 'true' && steps.scan.outputs.sarif-file != ''
      uses: github/codeql-action/upload-sarif@37f2634a92ba38a0926ef79a0748ac8ae7d95ab2 # v4.37.8
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-file }}
        category: praxis
        token: ${{ inputs.token }}
      continue-on-error: true

    - name: Enforce security gate
      if: steps.scan.outputs.fail == '1'
      shell: bash
      run: exit 1
