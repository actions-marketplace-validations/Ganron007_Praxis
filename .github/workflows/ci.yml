name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      # `scan --json` exits 0 even with findings, so this used to be a smoke test
      # rather than a gate — five critical false positives sat in the tree while
      # CI stayed green, because the scanner was reporting its own rule prose.
      # The scan is written outside the workspace so no artifact is left behind.
      - name: Dogfood — self-scan, no criticals in our own source
        run: |
          node cli/bin/praxis.js scan . --json --no-deps --timeout 30000 > "$RUNNER_TEMP/self-scan.json"
          node -e "
            const j = require(process.env.RUNNER_TEMP + '/self-scan.json');
            const crit = (j.findings || []).filter(f => f.severity === 'critical');
            for (const f of crit) console.error('  ' + f.severity + '  ' + f.rule + '  ' + f.file + ':' + f.line);
            console.log('self-scan: ' + j.totalFindings + ' findings, ' + crit.length + ' critical');
            process.exit(crit.length ? 1 : 0);
          "

      - name: Verify CLI help surface
        run: node cli/bin/praxis.js --help > /dev/null

  determinism:
    name: Determinism gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Two scans of an unchanged tree must produce identical detection identities.
      # A scanner whose output drifts cannot be baselined or trusted, so this fails the
      # build on drift rather than papering over it with a suppression.
      - name: Determinism — two scans must agree
        run: node scripts/check-determinism.mjs .

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Verify npm pack
        run: npm pack --dry-run

      - name: Smoke-test Marketplace action and composite outputs
        id: marketplace
        uses: ./
        with:
          threshold: '0'
          deps: 'false'
          sarif: 'false'
          comment: 'false'

      - name: Verify Marketplace outputs
        env:
          PRAXIS_SCORE: ${{ steps.marketplace.outputs.score }}
          PRAXIS_GRADE: ${{ steps.marketplace.outputs.grade }}
          PRAXIS_FINDINGS: ${{ steps.marketplace.outputs.findings }}
        run: |
          test -n "$PRAXIS_SCORE"
          test -n "$PRAXIS_GRADE"
          test -n "$PRAXIS_FINDINGS"
